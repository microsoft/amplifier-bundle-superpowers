# Subagent-Driven Development Workflow
# A sophisticated implementation workflow that dispatches fresh agents per task,
# with two-stage review after each: spec compliance first, then code quality.
#
# Key Features:
#   - Fresh agent per task (no context pollution between tasks)
#   - Per-task sequential pipeline (implement -> spec-review loop -> quality-review loop)
#   - Review convergence loops iterate until APPROVED
#   - Human approval gate after final review before finishing
#
# Workflow:
#   For EACH task:
#     1. Dispatch fresh implementer agent (TDD approach)
#     2. Spec compliance review - iterate until spec-compliant
#     3. Code quality review - iterate until approved
#     4. Mark task complete
#   After ALL tasks:
#     5. Full code review of entire implementation
#     6. APPROVAL GATE - human checkpoint
#     7. Verify tests and present merge options
#
# Usage:
#   amplifier run "execute superpowers:recipes/subagent-driven-development.yaml with plan_path=docs/implementation-plan.md"
#
# After the approval gate:
#   amplifier run "list pending approvals"
#   amplifier run "approve recipe session <session-id> stage final-review"
#   amplifier run "resume recipe session <session-id>"

name: "subagent-driven-development"
description: "Execute implementation plan with fresh agents per task and two-stage review (spec compliance then code quality)"
version: "4.0.0"
author: "Superpowers Bundle"
tags: ["implementation", "subagent", "tdd", "two-stage-review", "code-quality", "foreach", "per-task-pipeline", "checkpoint", "tiered-review"]

context:
  plan_path: ""  # Required: Path to the implementation plan file
  task_parallelism: false  # Set to 2 or 3 to enable bounded parallel task execution

stages:
  # ============================================================================
  # STAGE 1: Task Execution
  # Dispatch fresh agents to implement each task with two-stage review
  # ============================================================================
  - name: "task-execution"
    steps:
      # -----------------------------------------------------------------------
      # Step 1: Load and Parse Implementation Plan
      # -----------------------------------------------------------------------
      - id: "load-plan"
        agent: "superpowers:plan-writer"
        provider_preferences:
          - class: fast
        prompt: |
          Load the implementation plan from: {{plan_path}}

          Parse the plan and extract all implementation tasks as a structured list.

          For each task, extract:
          - task_id: Unique identifier or name
          - description: What needs to be implemented
          - spec: The detailed specification/requirements
          - acceptance_criteria: How to verify the task is complete
          - files: Files likely to be created or modified
          - dependencies: Any tasks this depends on (if applicable)

          Return the result as a JSON object with this exact structure:
          {"tasks": [<array of task objects>], "total_tasks": <number>}

          Each task object in the array must have these keys:
          - "task_id": string
          - "description": string
          - "spec": string (the detailed specification)
          - "acceptance_criteria": string
          - "files": array of file paths
          - "dependencies": array of task_ids (empty array if none)

          The "tasks" key MUST contain the ordered array. Order by dependencies (independent first).

          IMPORTANT: Preserve ALL spec details - they are critical for review.
        output: "plan_data"
        parse_json: true
        timeout: 600

      # -----------------------------------------------------------------------
      # Step 2: Per-Task Pipeline (implement -> spec-review -> quality-review)
      # Each task goes through the FULL pipeline before the next task starts.
      # -----------------------------------------------------------------------
      - id: "per-task-pipeline"
        foreach: "{{plan_data.tasks}}"
        as: "current_task"
        on_error: "continue"
        steps:
          # --- 2.0a: Check if task already completed (checkpoint) ---
          - id: "check-checkpoint"
            type: "bash"
            timeout: 30
            command: |
              TASK_ID=$(cat <<'TASKID_DELIM' | tr -d '\n' | sed 's/^[[:space:]]*//' | sed 's/[[:space:]]*$//'
              {{current_task.task_id}}
              TASKID_DELIM
              )
              if [ -f ".superpowers-checkpoint.json" ] && python3 -c "
              import json, sys
              with open('.superpowers-checkpoint.json') as f:
                  data = json.load(f)
              sys.exit(0 if '$TASK_ID' in data.get('completed_tasks', []) else 1)
              " 2>/dev/null; then
                echo "true"
              else
                echo "false"
              fi
            output: "task_already_done"

          # --- 2.0b: Initialize pipeline variables (prevents undefined var errors) ---
          - id: "init-impl-status"
            type: "bash"
            timeout: 10
            command: "echo SKIP"
            output: "impl_status"

          - id: "init-review-tier"
            type: "bash"
            timeout: 10
            command: "echo trivial"
            output: "review_tier"

          - id: "init-spec-flag"
            type: "bash"
            timeout: 10
            command: "echo true"
            output: "spec_approved"

          - id: "init-quality-flag"
            type: "bash"
            timeout: 10
            command: "echo true"
            output: "quality_approved"

          - id: "init-observation-notes"
            type: "bash"
            timeout: 10
            command: "echo '(none)'"
            output: "observation_notes"

          # --- 2a: Implement the task ---
          - id: "implement"
            condition: "{{task_already_done}} != 'true'"
            agent: "superpowers:implementer"
            prompt: |
              SUBAGENT IMPLEMENTATION TASK
              ============================

              You are a fresh agent assigned to implement ONE specific task.
              Focus ONLY on this task. Do not consider other tasks.

              TASK TO IMPLEMENT:
              {{current_task}}

              IMPLEMENTATION REQUIREMENTS:
              1. FOLLOW TDD (Test-Driven Development):
                 - Write failing tests FIRST based on the spec
                 - Implement code to make tests pass
                 - Refactor if needed while keeping tests green
              2. FOLLOW THE SPEC EXACTLY:
                 - Implement exactly what the spec says
                 - Do not add features not in the spec
                 - Do not skip any spec requirements
              3. VERIFY BEFORE COMPLETING:
                 - Run the tests you wrote
                 - Confirm they pass
                 - Commit your changes

              OUTPUT FORMAT:
              Return your implementation results including:
              - task_id: Which task was implemented
              - files_changed: [list of files created/modified]
              - tests_written: [list of test files/functions]
              - test_results: pass/fail with details
              - implementation_notes: Key decisions or notes
              - spec_coverage: How each spec requirement was addressed
            output: "task_implementation"
            timeout: 3600
            retry:
              max_attempts: 3
              backoff: exponential
              initial_delay: 5
              max_delay: 120

          # --- 2a.1: Extract implementer status ---
          - id: "extract-status"
            condition: "{{task_already_done}} != 'true'"
            type: "bash"
            timeout: 30
            command: |
              STATUS=$(cat <<'STATUS_DELIM' | grep -m1 '^STATUS:' | sed 's/^STATUS:[[:space:]]*//' | tr -d '[:space:]'
              {{task_implementation}}
              STATUS_DELIM
              )
              if [ -z "$STATUS" ]; then
                echo "DONE"
              else
                echo "$STATUS"
              fi
            output: "impl_status"

          # --- 2a.2: BLOCKED → immediate human flag ---
          - id: "blocked-flag"
            condition: "{{impl_status}} == 'BLOCKED'"
            agent: "superpowers:plan-writer"
            timeout: 120
            provider_preferences:
              - class: fast
            prompt: |
              BLOCKED TASK — HUMAN INTERVENTION NEEDED
              ==========================================
              Task {{current_task.task_id}} reported BLOCKED status.

              IMPLEMENTER REPORT:
              {{task_implementation}}

              Format a clear, concise summary of:
              1. Which task is blocked (task_id and description)
              2. What the specific blocker is
              3. What information or action the human needs to provide

              This is a flag for the human operator — keep it short and actionable.
            output: "blocked_flag"

          # --- 2a.3: Extract concerns if DONE_WITH_CONCERNS ---
          - id: "extract-concerns"
            condition: "{{impl_status}} == 'DONE_WITH_CONCERNS'"
            type: "bash"
            timeout: 30
            command: |
              cat <<'CONCERN_DELIM' | sed -n '/[Cc]oncern/,/^[A-Z][A-Z]/p' | head -30
              {{task_implementation}}
              CONCERN_DELIM
            output: "observation_notes"

          # --- 2a.4: Classify task complexity for tiered review ---
          - id: "classify-tier"
            condition: "{{impl_status}} != 'BLOCKED' and {{impl_status}} != 'SKIP'"
            type: "bash"
            timeout: 30
            command: |
              FILE_COUNT=$(cat <<'FILES_DELIM' | python3 -c "
              import json, sys
              data = sys.stdin.read().strip()
              try:
                  files = json.loads(data)
                  print(len(files) if isinstance(files, list) else 1)
              except Exception:
                  print(len([l for l in data.splitlines() if l.strip()]))
              "
              {{current_task.files}}
              FILES_DELIM
              )
              SPEC_WORDS=$(cat <<'SPEC_DELIM' | wc -w
              {{current_task.spec}}
              SPEC_DELIM
              )
              if [ "$FILE_COUNT" -le 1 ] && [ "$SPEC_WORDS" -lt 50 ]; then
                echo "trivial"
              elif [ "$FILE_COUNT" -le 5 ]; then
                echo "standard"
              else
                echo "complex"
              fi
            output: "review_tier"

          # --- 2b: Spec compliance review loop ---
          - id: "spec-review-loop"
            condition: "{{impl_status}} != 'BLOCKED' and {{review_tier}} == 'complex'"
            while_condition: "true"
            break_when: "{{spec_approved}} == 'true'"
            max_while_iterations: 3
            steps:
              - id: "spec-review"
                agent: "superpowers:spec-reviewer"
                prompt: |
                  SPEC COMPLIANCE REVIEW
                  ======================
                  Review Stage 1 of 2: Verify implementation matches specification EXACTLY.

                  TASK SPEC:
                  {{current_task}}

                  IMPLEMENTATION RESULT:
                  {{task_implementation}}

                  YOUR MISSION:
                  1. Read the ACTUAL CODE (do not trust the implementation report)
                  2. Compare every spec requirement against what was implemented
                  3. Run the test suite and read the full output
                  4. Check for missing requirements AND extra features

                  VERDICT FORMAT:
                  End your review with exactly one of:
                  - "VERDICT: APPROVED" — spec fully implemented, nothing extra
                  - "VERDICT: NEEDS CHANGES — [list specific issues]"

                  REVIEW CALIBRATION:
                  If this is a re-review (you can see previous feedback in the implementation result),
                  focus on whether the SPECIFIC ISSUES from the previous review were addressed.
                  Do not introduce new stylistic concerns on re-review — only flag functional
                  spec violations that remain unresolved. Minor style preferences do NOT warrant
                  NEEDS CHANGES on a re-review.

                  EXCEPTION: Critical bugs, security vulnerabilities, or data-safety issues
                  introduced by the fix itself must always be flagged regardless of review
                  iteration. This calibration applies to style preferences, not correctness.

                  IMPLEMENTER OBSERVATIONS:
                  {{observation_notes}}
                  (If the implementer flagged concerns, evaluate whether they indicate
                  correctness issues. If "(none)", ignore this section.)
                output: "spec_verdict"
                timeout: 600
                retry:
                  max_attempts: 3
                  backoff: exponential
                  initial_delay: 5
                  max_delay: 120

              # Extract a safe boolean from the raw markdown verdict
              - id: "extract-spec-verdict"
                type: "bash"
                timeout: 30
                command: |
                  if cat <<'VERDICT_DELIM' | grep -q "VERDICT: APPROVED"
                  {{spec_verdict}}
                  VERDICT_DELIM
                  then
                    echo "true"
                  else
                    echo "false"
                  fi
                output: "spec_approved"

              - id: "spec-fix"
                condition: "{{spec_approved}} == 'false'"
                agent: "superpowers:implementer"
                prompt: |
                  SPEC COMPLIANCE FIX (Iteration {{_loop_iteration}} of 3)
                  =========================================================
                  The spec reviewer found issues with your implementation.
                  This is review-fix iteration {{_loop_iteration}} of a maximum 3.
                  After 3 attempts, remaining issues will be flagged for human review.

                  REVIEW FEEDBACK:
                  {{spec_verdict}}

                  ORIGINAL TASK:
                  {{current_task}}

                  Focus on the MOST CRITICAL issues first. Fix ONLY the issues identified.
                  Do not add anything else. Do not refactor or improve beyond what was flagged.
                  Run tests after fixing. Commit your changes.

                  Return updated implementation results.
                output: "task_implementation"
                timeout: 3600
                retry:
                  max_attempts: 3
                  backoff: exponential
                  initial_delay: 5
                  max_delay: 120

          # --- 2b.1: Check if spec review exhausted without approval ---
          - id: "check-spec-resolution"
            condition: "{{spec_approved}} == 'false'"
            agent: "superpowers:plan-writer"
            timeout: 120
            provider_preferences:
              - class: fast
            prompt: |
              WARNING: Spec review loop exhausted after 3 iterations without approval.
              Task: {{current_task}}
              Last spec verdict: {{spec_verdict}}

              Flag this task as having unresolved spec issues. Include this warning
              in the task summary so the human reviewer is aware during the approval gate.
            output: "spec_unresolved"

          # --- 2b.2: Combined spec+quality review for standard tier ---
          - id: "combined-review"
            condition: "{{review_tier}} == 'standard'"
            agent: "superpowers:code-reviewer"
            timeout: 600
            retry:
              max_attempts: 3
              backoff: exponential
              initial_delay: 5
              max_delay: 120
            prompt: |
              COMBINED SPEC + QUALITY REVIEW (Standard Tier)
              ================================================
              This task has moderate complexity. Perform a single combined review
              covering both spec compliance AND code quality.

              TASK SPEC:
              Task ID: {{current_task.task_id}}
              Description: {{current_task.description}}
              Specification: {{current_task.spec}}
              Acceptance Criteria: {{current_task.acceptance_criteria}}
              Files: {{current_task.files}}

              IMPLEMENTATION RESULT:
              {{task_implementation}}

              IMPLEMENTER OBSERVATIONS:
              {{observation_notes}}

              YOUR MISSION:
              1. Read the ACTUAL CODE (do not trust the implementation report)
              2. Run the test suite and read the full output
              3. Check spec compliance: all requirements implemented, nothing extra
              4. Check code quality: clean code, error handling, test quality

              VERDICT FORMAT:
              End your review with exactly one of:
              - "VERDICT: APPROVED" — spec compliant and quality acceptable
              - "VERDICT: NEEDS CHANGES — [list specific issues]"

              Only critical and major issues require NEEDS CHANGES.
              Minor style preferences do NOT block approval.
            output: "combined_verdict"

          # --- 2c: Code quality review loop ---
          - id: "quality-review-loop"
            condition: "{{impl_status}} != 'BLOCKED' and {{review_tier}} == 'complex'"
            while_condition: "true"
            break_when: "{{quality_approved}} == 'true'"
            max_while_iterations: 3
            steps:
              - id: "quality-review"
                agent: "superpowers:code-quality-reviewer"
                prompt: |
                  CODE QUALITY REVIEW
                  ===================
                  Review Stage 2 of 2: Verify code quality and best practices.
                  Spec compliance has already been verified.

                  TASK:
                  {{current_task}}

                  IMPLEMENTATION:
                  {{task_implementation}}

                  YOUR MISSION:
                  1. Read the ACTUAL CODE
                  2. Run the test suite and read the full output
                  3. Check: clean code, DRY, error handling, test quality, maintainability
                  4. Do NOT change spec behavior — only refactor for quality

                  VERDICT FORMAT:
                  End your review with exactly one of:
                  - "VERDICT: APPROVED" — code quality meets standards
                  - "VERDICT: NEEDS CHANGES — [list specific issues by severity]"

                  Minor/suggestion issues do NOT block approval.
                  Only critical and major issues require NEEDS CHANGES.
                output: "quality_verdict"
                timeout: 600
                retry:
                  max_attempts: 3
                  backoff: exponential
                  initial_delay: 5
                  max_delay: 120

              # Extract a safe boolean from the raw markdown verdict
              - id: "extract-quality-verdict"
                type: "bash"
                timeout: 30
                command: |
                  if cat <<'VERDICT_DELIM' | grep -q "VERDICT: APPROVED"
                  {{quality_verdict}}
                  VERDICT_DELIM
                  then
                    echo "true"
                  else
                    echo "false"
                  fi
                output: "quality_approved"

              - id: "quality-fix"
                condition: "{{quality_approved}} == 'false'"
                agent: "superpowers:implementer"
                prompt: |
                  CODE QUALITY FIX (Iteration {{_loop_iteration}} of 3)
                  ======================================================
                  The code quality reviewer found issues.
                  This is review-fix iteration {{_loop_iteration}} of a maximum 3.
                  After 3 attempts, remaining issues will be flagged for human review.

                  REVIEW FEEDBACK:
                  {{quality_verdict}}

                  ORIGINAL TASK:
                  {{current_task}}

                  Focus on CRITICAL and IMPORTANT issues only. Minor suggestions do not
                  block approval. Fix ONLY the quality issues identified. Do NOT change
                  spec behavior. Run tests after fixing. Commit your changes.

                  Return updated implementation results.
                output: "task_implementation"
                timeout: 3600
                retry:
                  max_attempts: 3
                  backoff: exponential
                  initial_delay: 5
                  max_delay: 120

          # --- 2c.1: Check if quality review exhausted without approval ---
          - id: "check-quality-resolution"
            condition: "{{quality_approved}} == 'false'"
            agent: "superpowers:plan-writer"
            timeout: 120
            provider_preferences:
              - class: fast
            prompt: |
              WARNING: Quality review loop exhausted after 3 iterations without approval.
              Task: {{current_task}}
              Last quality verdict: {{quality_verdict}}

              Flag this task as having unresolved quality issues. Include this warning
              in the task summary so the human reviewer is aware during the approval gate.
            output: "quality_unresolved"

          # --- 2d: Write checkpoint after successful task completion ---
          - id: "write-checkpoint"
            condition: "{{impl_status}} == 'DONE' or {{impl_status}} == 'DONE_WITH_CONCERNS'"
            type: "bash"
            timeout: 30
            command: |
              TASK_ID=$(cat <<'TASKID_DELIM' | tr -d '\n' | sed 's/^[[:space:]]*//' | sed 's/[[:space:]]*$//'
              {{current_task.task_id}}
              TASKID_DELIM
              )
              if [ ! -f ".superpowers-checkpoint.json" ]; then
                echo '{"completed_tasks": []}' > .superpowers-checkpoint.json
              fi
              python3 -c "
              import json
              with open('.superpowers-checkpoint.json', 'r') as f:
                  data = json.load(f)
              task_id = '$TASK_ID'
              if task_id not in data.get('completed_tasks', []):
                  data.setdefault('completed_tasks', []).append(task_id)
              with open('.superpowers-checkpoint.json', 'w') as f:
                  json.dump(data, f, indent=2)
              print(f'Checkpoint saved: {task_id}')
              "

        collect: "completed_tasks"

      # -----------------------------------------------------------------------
      # Step 3: Task Completion Summary
      # -----------------------------------------------------------------------
      - id: "task-summary"
        agent: "superpowers:plan-writer"
        timeout: 120
        provider_preferences:
          - class: fast
        prompt: |
          TASK EXECUTION SUMMARY
          ======================
          Compile a summary of all completed tasks.

          COMPLETED TASKS:
          {{completed_tasks}}

          ORIGINAL TASKS:
          {{plan_data.tasks}}

          If any tasks have unresolved spec or quality issues (exhausted review iterations),
          prominently flag them in the summary with WARNING markers.

          Create a comprehensive summary including:

          ## Completion Status
          - Total tasks: [count]
          - Successfully completed: [count]

          ## Per-Task Summary
          For each task:
          - Task ID/Name
          - Spec compliance: approved (with iteration count if > 1)
          - Code quality: approved (with iteration count if > 1)
          - Files modified

          ## Issues Resolved
          Summary of issues found and fixed during reviews.
        output: "execution_summary"
        on_error: "continue"

  # ============================================================================
  # STAGE 2: Final Review (APPROVAL GATE)
  # Full code review of the entire implementation before finishing
  # ============================================================================
  - name: "final-review"
    steps:
      - id: "full-code-review"
        agent: "superpowers:code-quality-reviewer"
        timeout: 600
        prompt: |
          FINAL COMPREHENSIVE CODE REVIEW
          ================================
          Review the ENTIRE implementation across all tasks.

          EXECUTION SUMMARY:
          {{execution_summary}} (may be empty if summarization failed — use completed task data as primary source)

          COMPLETED TASKS:
          {{completed_tasks}}

          ORIGINAL PLAN:
          {{plan_path}}

          This is the final review before the implementation is considered complete.
          Look at the implementation HOLISTICALLY, not just individual tasks.

          REVIEW AREAS:
          1. CROSS-CUTTING CONCERNS
             - Are there patterns that should be unified?
             - Any inconsistencies between tasks?
             - Shared utilities that should be extracted?
          2. INTEGRATION
             - Do all tasks work together correctly?
             - Any integration issues between components?
             - Are interfaces consistent?
          3. ARCHITECTURE
             - Does the overall structure make sense?
             - Are dependencies appropriate?
             - Is the code organized logically?
          4. TEST COVERAGE
             - Is there adequate integration testing?
             - Any gaps in test coverage?
             - Are edge cases handled?
          5. DOCUMENTATION
             - Is code self-documenting?
             - Any complex logic that needs comments?
             - Is the public API clear?
          6. PRODUCTION READINESS
             - Error handling comprehensive?
             - Logging appropriate?
             - No debug code left in?

          OUTPUT FORMAT:
          ## Overall Assessment
          - Implementation Quality: [excellent/good/acceptable/needs-work]
          - Recommendation: [approve/approve-with-notes/request-changes]

          ## Findings by Category
          [Group findings by the review areas above]

          ## Critical Issues (if any)
          [Must be addressed before approval]

          ## Recommendations
          [Nice-to-have improvements for future]

          ## Files Changed Summary
          [Complete list of all files modified across all tasks]
        output: "final_review"
        retry:
          max_attempts: 3
          backoff: exponential
          initial_delay: 5
          max_delay: 120

      - id: "prepare-approval"
        agent: "superpowers:implementer"
        timeout: 600
        provider_preferences:
          - class: fast
        prompt: |
          Prepare for human approval checkpoint.

          FINAL REVIEW:
          {{final_review}}

          EXECUTION SUMMARY:
          {{execution_summary}} (may be empty if summarization failed)

          Run the full test suite to provide current test status:
          - Execute all tests
          - Report pass/fail counts
          - Note any failing tests

          Also prepare:
          - Git status showing all changes
          - Summary of branch state
          - List of commits made during implementation
        output: "approval_prep"
        on_error: "continue"

    approval:
      required: true
      prompt: |
        ======================================================================
        FINAL REVIEW COMPLETE - HUMAN APPROVAL REQUIRED
        ======================================================================

        The subagent-driven implementation is complete. All tasks have been:
        1. Implemented by fresh agents following TDD
        2. Reviewed for spec compliance (with iteration until approved)
        3. Reviewed for code quality (with iteration until approved)
        4. Given a final comprehensive review

        Review the final assessment above carefully.

        OPTIONS:
        - APPROVE: Accept the implementation and proceed to finish branch
        - DENY: Stop and address issues before continuing

        If you have feedback, note it before approving.
        ======================================================================
      timeout: 0
      default: "deny"

  # ============================================================================
  # STAGE 3: Finish Branch
  # Verify all tests pass and present merge options
  # ============================================================================
  - name: "finish"
    steps:
      - id: "verify-tests"
        agent: "superpowers:implementer"
        timeout: 600
        prompt: |
          FINAL VERIFICATION
          ==================
          Perform final verification before presenting merge options.

          FINAL REVIEW:
          {{final_review}}

          APPROVAL PREP:
          {{approval_prep}} (may be empty if preparation failed — proceed with verification regardless)

          Execute comprehensive verification:
          1. RUN FULL TEST SUITE
             - Run ALL tests (unit, integration, e2e if applicable)
             - Ensure 100% pass rate
             - Note test counts and coverage
          2. LINT AND FORMAT CHECK
             - Run linting tools
             - Check code formatting
             - Ensure no warnings
          3. BUILD CHECK (if applicable)
             - Verify project builds successfully
             - No build warnings
          4. FINAL GIT STATUS
             - Confirm all changes are committed
             - No uncommitted files
             - Branch is clean

          Report any failures. These MUST be fixed before merge.
        output: "verification_results"

      - id: "present-merge-options"
        agent: "foundation:zen-architect"
        mode: "ARCHITECT"
        timeout: 600
        provider_preferences:
          - class: fast
        prompt: |
          IMPLEMENTATION COMPLETE - MERGE OPTIONS
          =======================================

          VERIFICATION RESULTS:
          {{verification_results}}

          EXECUTION SUMMARY:
          {{execution_summary}} (may be empty if summarization failed)

          FINAL REVIEW:
          {{final_review}}

          Present the completion status and merge options.

          IF VERIFICATION PASSED:

          ## Implementation Complete

          All tasks from the implementation plan have been:
          - Implemented following TDD
          - Reviewed for spec compliance
          - Reviewed for code quality
          - Verified with passing tests

          ### Summary
          - Tasks completed: [count]
          - Tests passing: [count]
          - Average quality score: [score]/10

          ### Files Changed
          [Complete list of modified files]

          ### Next Steps - Choose One:
          1. **Merge to main branch**
             ```bash
             git checkout main
             git merge <current-branch>
             git push origin main
             ```
          2. **Create Pull Request**
             For team code review before merging.
             ```bash
             gh pr create --title "Implementation: [plan name]" --body "..."
             ```
          3. **Additional Human Review**
             Request detailed walkthrough of changes.

          ### Branch Information
          [Current branch name and commit info]

          IF VERIFICATION FAILED:

          ## Issues Found
          List what failed and needs to be addressed.
          Do NOT present merge options until issues are resolved.

          ### Required Fixes
          [List each issue that must be fixed]

          ### Next Steps
          Fix the listed issues, then re-run verification.
        output: "completion_report"
